<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>The Oregon Trail</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.png">
    </head>
    <body class="bg-secondary">
        <div class="container-fluid p-0 h-100">

            <!-- Bezel above screen -->
            <div class="row bg-secondary g-0 m-0">
                <div class="col-12 text-center text-white d-flex align-items-center justify-content-center"
                    style="height: 3.5vh; font-family: OregonBound; font-size: clamp(.5rem, 2.2vw, 1.75rem)">
                    The Oregon Trail
                </div>
            </div>

            <!-- Main display area -->
            <div class="row bg-secondary g-0 m-0" style="height: 52.083vw;">

                <!-- Left screen bezel -->
                <div class="col-1 bg-secondary"></div>

                <!-- Main game screen -->
                <span id="main" class="col-10"></span>

                <!-- Right screen bezel -->
                <div class="col-1 bg-secondary"></div>
            </div>

            <!-- Bezel below screen -->
            <div class="row bg-secondary g-0 m-0" style="height: 3.5vh;"></div>
        </div>
    </body>
</html>
